# ===========================================================================
#  martian-map.devs-solutions.tech — vhost nginx
#  À placer dans /etc/nginx/sites-available/martian-map.devs-solutions.tech
#  puis lier dans sites-enabled/ (voir DEPLOIEMENT.md).
#  Site 100 % statique : aucune base, aucun code serveur.
# ===========================================================================

server {
    listen 80;
    listen [::]:80;
    server_name martian-map.devs-solutions.tech;

    root /var/www/martian-map;
    index index.html;

    access_log /var/log/nginx/martian-map.access.log;
    error_log  /var/log/nginx/martian-map.error.log;

    # Les PNG de couches et le JSON de mission se compressent très bien.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # En-têtes de sécurité. Répétés dans chaque location : en nginx, un
    # add_header dans un bloc enfant annule ceux du parent.
    add_header X-Content-Type-Options   "nosniff"                          always;
    add_header X-Frame-Options          "SAMEORIGIN"                       always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin"  always;
    add_header Permissions-Policy       "geolocation=(), microphone=(), camera=()" always;

    # Imagerie, modèle de terrain et polices : immuables entre deux versions.
    location ~* \.(png|jpe?g|webp|avif|woff2?|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Code et données : courte durée, pour qu'une correction parte vite.
    location ~* \.(js|css|json)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Rien à servir ici : le dossier des sources de données brutes n'est
    # jamais déployé, mais on ferme la porte par principe.
    location ~ /\. { deny all; }
}
